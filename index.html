<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fast-paced platformer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #181e2a;
        overflow: hidden;
      }
      #stage {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100dvh;
      }
      #stage canvas {
        display: block;
        image-rendering: pixelated;
      }
      #ed {
        position: fixed;
        top: 0;
        left: 0;
        display: none;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        max-width: 260px;
        background: #181e2ae8;
        color: #fff9e4;
        font: 12px monospace;
      }
      #ed.on {
        display: flex;
      }
      #ed input,
      #ed select,
      #ed button {
        font: inherit;
        color: inherit;
        background: #2f2a4c;
        border: 1px solid #546a00;
        padding: 3px 5px;
      }
      #ed .row {
        display: flex;
        gap: 4px;
      }
      #ed .row > * {
        flex: 1;
        min-width: 0;
      }
      #pal {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 3px;
      }
      #pal button.on {
        background: #b53b59;
      }
      #status {
        color: #ffb915;
        min-height: 1.2em;
        overflow-wrap: anywhere;
      }
      #menu {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 14px;
        background: #181e2af2;
        color: #fff9e4;
        font: 16px monospace;
      }
      #menu.on {
        display: flex;
      }
      #menu h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 3px;
        color: #ffb915;
      }
      #menu-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 55vh;
        overflow-y: auto;
      }
      #menu-list button {
        font: inherit;
        color: inherit;
        background: #2f2a4c;
        border: 1px solid #546a00;
        padding: 8px 28px;
        cursor: pointer;
      }
      #menu-list button:hover {
        background: #b53b59;
      }
      #menu-hint {
        font-size: 12px;
        color: #9666ee;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ed">
      <div class="row">
        <select id="pick"></select>
        <button id="new">new</button>
      </div>
      <div id="pal"></div>
      <div class="row">
        <button id="save">save</button>
        <button id="reload">reload</button>
      </div>
      <input id="token" type="password" placeholder="github token (to save)" />
      <div id="status"></div>
      <div>e play · drag paint · right-click erase · wasd pan</div>
    </div>
    <div id="menu">
      <h1>PICK AN ACT</h1>
      <div id="menu-list"></div>
      <div id="menu-hint">esc for this list · e to edit</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
